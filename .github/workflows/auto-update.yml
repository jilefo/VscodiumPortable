name: auto-update

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect latest VSCodium
        id: detect
        uses: actions/github-script@60a0d83039c74a4aee543508d2ebcb1c37919c10 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const upstream = { owner: 'VSCodium', repo: 'vscodium' };
            const unstablePattern = /(alpha|beta|preview|rc)/i;

            function compareVersions(left, right) {
              const leftParts = left.split('.').map(Number);
              const rightParts = right.split('.').map(Number);
              for (let i = 0; i < Math.max(leftParts.length, rightParts.length); i++) {
                const diff = (leftParts[i] || 0) - (rightParts[i] || 0);
                if (diff !== 0) return diff;
              }
              return 0;
            }

            function candidateFromRelease(release) {
              if (release.draft || release.prerelease || unstablePattern.test(`${release.name || ''} ${release.tag_name || ''}`)) {
                return null;
              }
              if (!/^\d+(\.\d+){2,3}$/.test(release.tag_name)) {
                return null;
              }
              const archiveName = `VSCodium-win32-x64-${release.tag_name}.zip`;
              const asset = (release.assets || []).find(a => a.name === archiveName);
              return asset ? { version: release.tag_name, downloadUrl: asset.browser_download_url, publishedAt: release.published_at } : null;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, { ...upstream, per_page: 100 });
            const candidates = releases.map(candidateFromRelease).filter(Boolean);
            if (candidates.length === 0) {
              core.info('No stable VSCodium Windows x64 ZIP release found');
              core.setOutput('has_update', 'false');
              return;
            }
            candidates.sort((left, right) =>
              compareVersions(left.version, right.version) || new Date(left.publishedAt) - new Date(right.publishedAt));
            const latest = candidates.at(-1);

            const bpFile = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const content = fs.readFileSync(bpFile, 'utf8');
            const match = content.match(/^app\.version[ \t]*=[ \t]*([^\r\n]+)/m);
            if (!match) throw new Error('Missing app.version in build.properties');
            const currentVersion = match[1].trim();

            if (compareVersions(latest.version, currentVersion) <= 0) {
              core.info(`Already up to date: ${currentVersion}`);
              core.setOutput('has_update', 'false');
              return;
            }
            core.info(`Update available: ${currentVersion} -> ${latest.version}`);
            core.setOutput('has_update', 'true');
            core.setOutput('version', latest.version);
            core.setOutput('download_url', latest.downloadUrl);

      - name: Bump version files
        if: steps.detect.outputs.has_update == 'true'
        id: bump
        uses: actions/github-script@60a0d83039c74a4aee543508d2ebcb1c37919c10 # v7.0.1
        env:
          NEW_VERSION: ${{ steps.detect.outputs.version }}
          NEW_DOWNLOAD_URL: ${{ steps.detect.outputs.download_url }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.NEW_VERSION;
            const downloadUrl = process.env.NEW_DOWNLOAD_URL;

            function propertyValue(text, name) {
              const m = text.match(new RegExp(`^${name.replaceAll('.', '\\.')}[ \t]*=[ \t]*([^\r\n]+)`, 'm'));
              if (!m) throw new Error(`Missing ${name} in build.properties`);
              return m[1].trim();
            }
            function replaceProperty(text, name, value) {
              const pattern = new RegExp(`^(${name.replaceAll('.', '\\.')}[ \t]*=[ \t]*)[^\r\n]+`, 'm');
              return text.replace(pattern, (_, prefix) => `${prefix}${value}`);
            }

            const bpFile = 'build.properties';
            let content = fs.readFileSync(bpFile, 'utf8');
            const currentRelease = Number(propertyValue(content, 'app.release'));
            if (!Number.isInteger(currentRelease)) throw new Error('Invalid app.release');
            const newRelease = currentRelease + 1;
            content = replaceProperty(content, 'app.version', version);
            content = replaceProperty(content, 'atf.win64.url', downloadUrl);
            content = replaceProperty(content, 'app.release', String(newRelease));
            fs.writeFileSync(bpFile, content, 'utf8');

            const viFile = 'versioninfo.json';
            const vi = JSON.parse(fs.readFileSync(viFile, 'utf8'));
            const parts = version.split('.').map(Number);
            vi.FixedFileInfo.FileVersion = { Major: parts[0], Minor: parts[1], Patch: parts[2], Build: newRelease };
            vi.StringFileInfo.FileVersion = `${version}.${newRelease}`;
            vi.StringFileInfo.ProductVersion = `${version}.${newRelease}`;
            fs.writeFileSync(viFile, JSON.stringify(vi, null, 2) + '\n', 'utf8');

            core.info(`Bumped to ${version}-${newRelease}`);
            core.setOutput('release', String(newRelease));

      - name: Commit and push
        if: steps.detect.outputs.has_update == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEW_VERSION: ${{ steps.detect.outputs.version }}
          NEW_RELEASE: ${{ steps.bump.outputs.release }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN secret is not configured. Create it in repo settings with contents:write + workflows:write permissions."
            exit 1
          fi
          git config user.name "auto-update[bot]"
          git config user.email "auto-update[bot]@users.noreply.github.com"
          git add build.properties versioninfo.json
          git commit -m "Update VSCodium to ${NEW_VERSION}"
          AUTH_URL="https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${AUTH_URL}" HEAD:"${GITHUB_REF_NAME}"
          git tag "${NEW_VERSION}-${NEW_RELEASE}"
          git push "${AUTH_URL}" "${NEW_VERSION}-${NEW_RELEASE}"
