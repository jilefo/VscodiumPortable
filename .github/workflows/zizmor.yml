name: zizmor

# Note: the `secrets-outside-env` rule is intentionally disabled by the
# upstream crazy-max/.github reusable workflow. released.yml legitimately
# forwards secrets (VT_API_KEY / VT_MONITOR_API_KEY) to reusable workflows
# via `secrets: inherit` - the supported pattern that never places secret
# values into command strings, environment values or logs. Keeping the rule
# disabled avoids false positives for that legitimate usage.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  run:
    uses: crazy-max/.github/.github/workflows/zizmor.yml@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      min-severity: medium
      min-confidence: medium
      persona: pedantic
