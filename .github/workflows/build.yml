name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  pull_request:

jobs:
  build:
    timeout-minutes: 60
    uses: ./.github/workflows/app-build.yml
    permissions:
      contents: write # required to create a GitHub release on push with a tag
