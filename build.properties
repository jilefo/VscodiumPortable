# Portapps
core.dir = ../portapps

# Version semantics
#   app.version / app.release form the product version ("<version>.<release>",
#   e.g. "1.140.06880.60").
#   versioninfo.json StringFileInfo.ProductVersion mirrors the product version.
#   versioninfo.json FixedFileInfo.FileVersion is the Windows file version; it
#   is aligned to the product version (1.140.06880.60) by the build; keep it in
#   sync with StringFileInfo.ProductVersion (update-app.ps1 refreshes both).

# App
app = vscodium
app.name = VSCodium
app.type = archive
app.version = 1.140.06880
app.release = 60
app.homepage = https://vscodium.com/

# Portable app
papp.id = vscodiumportable
papp.guid = {6C7629A7-87D9-40F9-B32E-24F2C3E6E67A}
papp.name = ${app.name} Portable
papp.desc = ${app.name} portable on Windows by Portapps
papp.url = https://github.com/portapps/vscodium-portable
papp.folder = app

# Official artifact
atf.id = VSCodium
atf.win64.filename = ${atf.id}-win32-x64-${app.version}
atf.win64.ext = .zip
atf.win64.url = https://github.com/VSCodium/vscodium/releases/download/1.140.06880/VSCodium-win32-x64-1.140.06880.zip
atf.win64.assertextract = VSCodium.exe
